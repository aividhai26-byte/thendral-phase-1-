{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<section class="section" style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
    <div class="container text-center animate-on-scroll slide-up">
        <h1 style="font-size: 120px; color: #F3C623; margin-bottom: var(--spacing-md);">404</h1>
        <h2 style="margin-bottom: var(--spacing-md);">Page Not Found</h2>
        <p style="margin-bottom: var(--spacing-xl); max-width: 600px; margin-left: auto; margin-right: auto;">The page you are looking for doesn't exist or has been moved. Please check the URL or navigate to another page.</p>
        <a href="/" class="btn btn-primary btn-lg btn-animate">Back to Home</a>
    </div>
</section>
{% endblock %}
